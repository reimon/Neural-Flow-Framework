<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" aria-label="Caminho de uma mudanca no Neural-Flow: os artefatos do projeto sao lidos pelos guards; o hook de pre-commit valida o que esta em stage e barra o commit quando algum reprova; depois do push o CI revalida, porque o hook e opt-in por clone. Divergencias, evidencia e memoria realimentam o ciclo.">
<defs>
<marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3c2cb"/></marker>
<marker id="seta-bloq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c0392f"/></marker>
<marker id="seta-passa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#12805a"/></marker>
</defs>
<rect width="1280" height="720" rx="14" fill="#ffffff"/>
<text x="40" y="50" font-size="21" font-weight="700" fill="#17242c">Neural-Flow — como uma mudanca vira commit</text>
<text x="40" y="73" font-size="12.5" fill="#7d8b94">O caminho da intencao ate a branch, e os pontos onde ele e barrado</text>
<line x1="40" y1="94" x2="1240" y2="94" stroke="#d3dde3"/>
<text x="40" y="124" font-size="10" font-weight="700" fill="#7d8b94" letter-spacing="1.4">INTENCAO</text>
<rect x="40" y="148" width="186" height="62" rx="8" fill="#ffffff" stroke="#b3c2cb" stroke-width="1"/><text x="54" y="171" font-size="13" font-weight="620" fill="#17242c">Agente ou pessoa</text><text x="54" y="189" font-size="11" fill="#4a5a64">quer mudar o sistema</text>
<rect x="40" y="226" width="186" height="76" rx="8" fill="#f3f6f8" stroke="#d3dde3" stroke-width="1"/><text x="54" y="249" font-size="13" font-weight="620" fill="#17242c">Sem sprint,</text><text x="54" y="267" font-size="11" fill="#4a5a64">nao ha execucao</text><text x="54" y="283" font-size="11" font-weight="700" fill="#17242c">autorizada.</text>
<text x="300" y="124" font-size="10" font-weight="700" fill="#7d8b94" letter-spacing="1.4">ARTEFATOS QUE O GATE LE</text>
<rect x="300" y="148" width="286" height="54" rx="8" fill="#e9f0f3" stroke="#d3dde3" stroke-width="1"/><text x="314" y="171" font-size="12.5" font-weight="620" fill="#17242c">docs/sprints/</text><text x="572" y="171" font-size="10" font-weight="700" fill="#146c84" text-anchor="end">S1–S6 · B1–B4</text><text x="314" y="189" font-size="11" fill="#4a5a64">sprint validada, escopo, autonomia</text>
<rect x="300" y="210" width="286" height="54" rx="8" fill="#e9f0f3" stroke="#d3dde3" stroke-width="1"/><text x="314" y="233" font-size="12.5" font-weight="620" fill="#17242c">docs/modulos/</text><text x="572" y="233" font-size="10" font-weight="700" fill="#146c84" text-anchor="end">P1–P4</text><text x="314" y="251" font-size="11" fill="#4a5a64">spec no padrao obrigatorio</text>
<rect x="300" y="272" width="286" height="54" rx="8" fill="#e9f0f3" stroke="#d3dde3" stroke-width="1"/><text x="314" y="295" font-size="12.5" font-weight="620" fill="#17242c">docs/adr/</text><text x="572" y="295" font-size="10" font-weight="700" fill="#146c84" text-anchor="end">A1–A6</text><text x="314" y="313" font-size="11" fill="#4a5a64">decisao numerada e imutavel</text>
<rect x="300" y="334" width="286" height="54" rx="8" fill="#e9f0f3" stroke="#d3dde3" stroke-width="1"/><text x="314" y="357" font-size="12.5" font-weight="620" fill="#17242c">build/</text><text x="572" y="357" font-size="10" font-weight="700" fill="#146c84" text-anchor="end">C1–C6</text><text x="314" y="375" font-size="11" fill="#4a5a64">plano, diario, divergencias</text>
<rect x="300" y="396" width="286" height="54" rx="8" fill="#e9f0f3" stroke="#d3dde3" stroke-width="1"/><text x="314" y="419" font-size="12.5" font-weight="620" fill="#17242c">graphify-out/</text><text x="572" y="419" font-size="10" font-weight="700" fill="#146c84" text-anchor="end">V1–V3</text><text x="314" y="437" font-size="11" fill="#4a5a64">indice consultado antes de ler</text>
<line x1="232" y1="175" x2="292" y2="175" stroke="#b3c2cb" stroke-width="1.5" marker-end="url(#seta)"/><text x="262.0" y="166.0" font-size="10.5" fill="#4a5a64" text-anchor="middle">produz</text>
<text x="700" y="124" font-size="10" font-weight="700" fill="#7d8b94" letter-spacing="1.4">GATE LOCAL</text>
<rect x="700" y="148" width="250" height="62" rx="8" fill="#ffffff" stroke="#b3c2cb" stroke-width="1"/><text x="714" y="171" font-size="13" font-weight="620" fill="#17242c">git add</text><text x="714" y="189" font-size="11" fill="#4a5a64">caminhos explicitos, nunca -A</text>
<line x1="825.0" y1="210" x2="825.0" y2="244" stroke="#b3c2cb" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="700" y="244" width="250" height="108" rx="8" fill="#f1f8fa" stroke="#146c84" stroke-width="1"/><text x="714" y="267" font-size="13" font-weight="620" fill="#17242c">hook de pre-commit</text><text x="714" y="285" font-size="11" fill="#4a5a64">materializa o indice numa</text><text x="714" y="301" font-size="11" fill="#4a5a64">arvore temporaria e valida la</text><text x="714" y="317" font-size="11" fill="#4a5a64">o checado e o que entraria</text><text x="714" y="333" font-size="11" fill="#4a5a64">no commit — nao o editor</text>
<line x1="592" y1="300" x2="692" y2="300" stroke="#b3c2cb" stroke-width="1.5" marker-end="url(#seta)"/><text x="642.0" y="291.0" font-size="10.5" fill="#4a5a64" text-anchor="middle">le o stage</text>
<line x1="825.0" y1="352" x2="825.0" y2="366" stroke="#c0392f" stroke-width="1.5" marker-end="url(#seta-bloq)"/>
<rect x="700" y="374" width="250" height="58" rx="8" fill="#fdf3f2" stroke="#c0392f" stroke-width="1"/><text x="714" y="397" font-size="12" font-weight="620" fill="#c0392f">reprovou: commit barrado</text><text x="714" y="415" font-size="11" fill="#4a5a64">corrija o artefato, nao o gate</text>
<path d="M700 403 L614 403 L614 432 L594 432" fill="none" stroke="#c0392f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta-bloq)"/>
<text x="1010" y="124" font-size="10" font-weight="700" fill="#7d8b94" letter-spacing="1.4">AUTORIDADE</text>
<line x1="956" y1="300" x2="1002" y2="300" stroke="#12805a" stroke-width="1.5" marker-end="url(#seta-passa)"/><text x="979.0" y="291.0" font-size="10.5" fill="#4a5a64" text-anchor="middle">passou</text>
<rect x="1010" y="148" width="230" height="62" rx="8" fill="#ffffff" stroke="#b3c2cb" stroke-width="1"/><text x="1024" y="171" font-size="13" font-weight="620" fill="#17242c">commit</text><text x="1024" y="189" font-size="11" fill="#4a5a64">um por item do plano</text>
<line x1="1125.0" y1="210" x2="1125.0" y2="244" stroke="#b3c2cb" stroke-width="1.5" marker-end="url(#seta)"/>
<rect x="1010" y="244" width="230" height="108" rx="8" fill="#f1f9f5" stroke="#12805a" stroke-width="1"/><text x="1024" y="267" font-size="13" font-weight="620" fill="#17242c">CI: os mesmos guards</text><text x="1024" y="285" font-size="11" fill="#4a5a64">o hook e opt-in por clone,</text><text x="1024" y="301" font-size="11" fill="#4a5a64">entao guard que depende de</text><text x="1024" y="317" font-size="11" fill="#4a5a64">configuracao de maquina</text><text x="1024" y="333" font-size="11" font-weight="700" fill="#17242c">nao e guard</text>
<line x1="1125.0" y1="352" x2="1125.0" y2="386" stroke="#12805a" stroke-width="1.5" marker-end="url(#seta-passa)"/>
<rect x="1010" y="386" width="230" height="56" rx="8" fill="#ffffff" stroke="#d3dde3" stroke-width="1"/><text x="1024" y="409" font-size="13" font-weight="620" fill="#17242c">branch</text><text x="1024" y="427" font-size="11" fill="#4a5a64">estado publicado</text>
<line x1="40" y1="462" x2="1240" y2="462" stroke="#d3dde3"/>
<text x="40" y="486" font-size="10" font-weight="700" fill="#7d8b94" letter-spacing="1.4">O QUE VOLTA PARA O CICLO</text>
<rect x="40" y="500" width="386.6666666666667" height="74" rx="8" fill="#f3f6f8" stroke="#d3dde3" stroke-width="1"/><text x="54" y="523" font-size="12.5" font-weight="620" fill="#17242c">divergencias</text><text x="54" y="541" font-size="11" fill="#4a5a64">decisao que o loop tomou sozinho</text><text x="54" y="557" font-size="11" fill="#4a5a64">→ fila de revisao humana</text>
<rect x="446.6666666666667" y="500" width="386.6666666666667" height="74" rx="8" fill="#f3f6f8" stroke="#d3dde3" stroke-width="1"/><text x="460.6666666666667" y="523" font-size="12.5" font-weight="620" fill="#17242c">evidencia</text><text x="460.6666666666667" y="541" font-size="11" fill="#4a5a64">verde do comando de verificacao</text><text x="460.6666666666667" y="557" font-size="11" fill="#4a5a64">→ fecha o item da sprint</text>
<rect x="853.3333333333334" y="500" width="386.6666666666667" height="74" rx="8" fill="#f3f6f8" stroke="#d3dde3" stroke-width="1"/><text x="867.3333333333334" y="523" font-size="12.5" font-weight="620" fill="#17242c">memoria e indice</text><text x="867.3333333333334" y="541" font-size="11" fill="#4a5a64">licao datada, reindex incremental</text><text x="867.3333333333334" y="557" font-size="11" fill="#4a5a64">→ barateia a proxima sessao</text>
<line x1="1125.0" y1="442" x2="1125.0" y2="452" stroke="#b3c2cb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seta)"/>
<text x="1135.0" y="466" font-size="10.5" fill="#4a5a64">realimenta</text>
<line x1="40" y1="606" x2="1240" y2="606" stroke="#d3dde3"/>
<text x="40" y="632" font-size="10" font-weight="700" fill="#7d8b94" letter-spacing="1.4">GUARDS EXECUTAVEIS<tspan fill="#146c84">   python3 scripts/nf_gate.py</tspan></text>
