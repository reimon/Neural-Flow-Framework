<rect x="443.3333333333333" y="644" width="191.66666666666666" height="50" rx="8" fill="#f3f6f8" stroke="#d3dde3" stroke-width="1"/><text x="457.3333333333333" y="667" font-size="11" font-weight="620" fill="#17242c">context-vector</text><text x="621.0" y="667" font-size="10" font-weight="700" fill="#146c84" text-anchor="end">V1–V3</text><text x="457.3333333333333" y="685" font-size="11" fill="#4a5a64">context</text>
